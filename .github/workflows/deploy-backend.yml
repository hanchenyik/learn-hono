name: Test and deploy Lumière backend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm run check

  deploy-backend:
    if: github.event_name != 'pull_request' && vars.ENABLE_LUMIERE_DEPLOY == 'true'
    needs: test-backend
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - name: Validate runtime secrets
        run: test -n "$BETTER_AUTH_SECRET" && test -n "$BREVO_API_KEY"
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      - run: node scripts/migration-preflight.mjs
      - run: printf '%s' "$BETTER_AUTH_SECRET" | npx wrangler secret put BETTER_AUTH_SECRET
        working-directory: backend
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      - run: printf '%s' "$BREVO_API_KEY" | npx wrangler secret put BREVO_API_KEY
        working-directory: backend
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      - run: npm run db:migrate:remote --prefix backend
      - run: npm run deploy --prefix backend
