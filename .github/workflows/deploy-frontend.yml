name: Test and deploy PetitBakery frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run check:stage2

  deploy-frontend:
    if: github.event_name != 'pull_request'
    needs: test-frontend
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Write browser-safe Supabase configuration
        run: node -e "const fs=require('fs');if(!process.env.SUPABASE_URL||!process.env.SUPABASE_PUBLISHABLE_KEY)throw Error('Missing Supabase browser configuration');fs.writeFileSync('frontend/js/config.js','window.APP_CONFIG='+JSON.stringify({API_BASE:'https://petitbakery-api.hanchenyik.workers.dev',SUPABASE_URL:process.env.SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY:process.env.SUPABASE_PUBLISHABLE_KEY})+';\\n')"
      - run: npx wrangler pages deploy frontend --project-name petitbakery --branch main
