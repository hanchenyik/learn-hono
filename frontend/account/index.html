<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/petitbakery-logo.png" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="/js/config.js"></script>
    <title>Account · PetitBakery</title>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <header id="site-header" class="sticky top-0 z-40"></header>
    <main class="mx-auto max-w-5xl px-4 py-10 sm:px-6 lg:px-8">
      <div class="flex flex-wrap items-end justify-between gap-4">
        <div>
          <p
            class="text-sm font-semibold uppercase tracking-wider text-slate-400"
          >
            Account
          </p>
          <h1 id="account-name" class="mt-1 text-4xl font-black">Loading…</h1>
          <p id="account-email" class="mt-2 text-slate-500"></p>
        </div>
        <button
          id="logout"
          class="rounded-xl border border-slate-300 bg-white px-4 py-2 font-semibold hover:bg-slate-100"
        >
          Sign out
        </button>
      </div>
      <section class="mt-10 rounded-3xl border border-slate-200 bg-white p-6">
        <h2 class="text-xl font-black">Default delivery address</h2>
        <form id="address-form" class="mt-4 grid gap-3 sm:grid-cols-2">
          <label class="sm:col-span-2 text-sm">Full name<input name="fullName" required class="mt-1 w-full rounded-xl border border-slate-300 p-3"></label><label class="sm:col-span-2 text-sm">Address<input name="address1" required class="mt-1 w-full rounded-xl border border-slate-300 p-3"></label><label class="text-sm">City<input name="city" required class="mt-1 w-full rounded-xl border border-slate-300 p-3"></label><label class="text-sm">Postal code<input name="postalCode" required class="mt-1 w-full rounded-xl border border-slate-300 p-3"></label><label class="sm:col-span-2 text-sm">Country<input name="country" value="Malaysia" required class="mt-1 w-full rounded-xl border border-slate-300 p-3"></label><button class="w-fit rounded-xl bg-slate-950 px-4 py-2 font-semibold text-white">Save address</button>
        </form>
      </section>
      <section class="mt-10">
        <h2 class="text-xl font-black">Orders</h2>
        <div id="orders" class="mt-4 space-y-3">
          <p class="text-slate-500">Loading orders…</p>
        </div>
      </section>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="/account/account.js"></script>
  </body>
</html>
