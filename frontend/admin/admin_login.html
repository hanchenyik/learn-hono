<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f1f5f9;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 400px;

            background: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .login-header {
            text-align: center;

            margin-bottom: 30px;
        }

        .logo {
            width: 60px;
            height: 60px;

            margin: 0 auto 15px;

            background: #1e293b;

            color: white;

            border-radius: 10px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 28px;
        }

        .login-header h1 {
            color: #1e293b;

            font-size: 26px;

            margin-bottom: 8px;
        }

        .login-header p {
            color: #64748b;

            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            color: #334155;

            font-size: 14px;

            font-weight: bold;
        }

        .form-group input {
            width: 100%;

            padding: 12px;

            border: 1px solid #cbd5e1;

            border-radius: 6px;

            font-size: 14px;

            outline: none;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background: #2563eb;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .login-btn:disabled {
            background: #94a3b8;

            cursor: not-allowed;
        }

        .remember-row {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

            font-size: 13px;
        }

        .remember {
            display: flex;

            align-items: center;

            gap: 6px;

            color: #475569;
        }

        .remember input {
            width: auto;
        }

        .forgot {
            color: #2563eb;

            text-decoration: none;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .register-link {
            text-align: center;

            margin-top: 20px;

            color: #64748b;

            font-size: 14px;
        }

        .register-link a {
            color: #2563eb;

            font-weight: bold;

            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .security-notice {
            margin-top: 20px;

            padding: 10px;

            background: #f8fafc;

            border: 1px solid #e2e8f0;

            border-radius: 6px;

            text-align: center;

            color: #64748b;

            font-size: 12px;
        }

        .message {
            display: none;

            margin-bottom: 18px;

            padding: 10px;

            border-radius: 6px;

            font-size: 13px;

            text-align: center;
        }

        .message.error {
            display: block;

            background: #fef2f2;

            border: 1px solid #fecaca;

            color: #b91c1c;
        }

        .message.success {
            display: block;

            background: #f0fdf4;

            border: 1px solid #bbf7d0;

            color: #15803d;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-header">

            <div class="logo">
                🔐
            </div>

            <h1>Admin Login</h1>

            <p>Cybersecurity E-Commerce System</p>

        </div>


        <!-- Login Message -->

        <div id="message" class="message"></div>


        <!-- Login Form -->

        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Admin Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter admin email"
                    required
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <div class="remember-row">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    Remember me

                </label>


                <a
                    href="#"
                    class="forgot"
                    onclick="forgotPassword(event)"
                >
                    Forgot Password?
                </a>

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >
                Login
            </button>

        </form>


        <!-- Register -->

        <div class="register-link">

            Don't have an admin account?

            <a href="admin_register.html">
                Register
            </a>

        </div>


        <!-- Security Notice -->

        <div class="security-notice">

            🔒 Authorized administrators only

        </div>

    </div>


    <script>

        // ==========================================
        // Better Auth API
        // ==========================================

        const API_URL =
             "http://localhost:8787";


        // ==========================================
        // Get HTML Elements
        // ==========================================

        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");


        // ==========================================
        // Show Message
        // ==========================================

        function showMessage(text, type) {

            message.textContent = text;

            message.className = "message " + type;

        }


        // ==========================================
        // Login
        // ==========================================

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document.getElementById("email")
                    .value
                    .trim();


                const password =
                    document.getElementById("password")
                    .value;


                if (!email || !password) {

                    showMessage(
                        "Please enter your email and password.",
                        "error"
                    );

                    return;
                }


                // Disable button

                loginButton.disabled = true;

                loginButton.textContent = "Logging in...";


                try {

                    const response =
                        await fetch(
                            `${API_URL}/api/auth/sign-in/email`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                credentials: "include",

                                body: JSON.stringify({
                                    email: email,
                                    password: password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    // ==================================
                    // Login Failed
                    // ==================================

                    if (!response.ok) {

                        console.error(
                            "Login error:",
                            data
                        );


                        showMessage(
                            data.message ||
                            data.error ||
                            "Login failed. Please check your email and password.",
                            "error"
                        );


                        loginButton.disabled = false;

                        loginButton.textContent = "Login";

                        return;
                    }


                    // ==================================
                    // Login Successful
                    // ==================================

                    showMessage(
                        "Login successful. Redirecting...",
                        "success"
                    );


                    // Wait briefly so user can see message

                    setTimeout(
                        function() {

                            window.location.href =
                                "admin_index.html";

                        },
                        500
                    );


                } catch (error) {

                    console.error(
                        "Connection error:",
                        error
                    );


                    showMessage(
                        "Unable to connect to the server. Please try again.",
                        "error"
                    );


                    loginButton.disabled = false;

                    loginButton.textContent = "Login";

                }

            }
        );


        // ==========================================
        // Forgot Password
        // ==========================================

        function forgotPassword(event) {

            event.preventDefault();

            alert(
                "Password reset will be implemented later."
            );

        }

    </script>

</body>
</html>
