<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <link rel="stylesheet" href="/styles.css?v=payment-ui-2">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="/js/config.js"></script>
    <title>Checkout · LUMIÈRE</title>
</head>
<body class="bg-slate-50 text-slate-900">
    <header id="site-header" class="sticky top-0 z-40"></header>
    <main class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
        <h1 class="text-4xl font-serif">Checkout</h1>
        <p class="mt-2 text-slate-500">Enter your delivery or pickup details, then choose how to pay. No charge will be made.</p>
        
        <div id="checkout-root" class="mt-8 grid gap-8 lg:grid-cols-[1fr_380px]">
            <form id="checkout-form" class="rounded-none border border-slate-200 bg-white p-6 shadow-sm">
                
                <!-- Contact Info (Always Visible) -->
                <h2 class="text-xl font-serif">Contact information</h2>
                <div class="mt-6 grid gap-4 sm:grid-cols-2">
                    <label class="sm:col-span-1">
                        <span class="text-sm font-medium">Full name</span>
                        <input name="fullName" required maxlength="80" autocomplete="name" class="mt-2 w-full rounded-none border border-slate-300 px-4 py-3">
                    </label>
                    <label class="sm:col-span-1 block">
                        <span class="text-sm font-medium">Phone number</span>
                        <div class="mt-2 flex w-full overflow-hidden rounded-none border border-slate-300 bg-white focus-within:ring-2 focus-within:ring-slate-950">
                            <select name="countryCode" class="border-y-0 border-l-0 border-r border-slate-300 bg-slate-50 px-3 py-3 text-sm text-slate-700 focus:outline-none cursor-pointer">
                                <option value="+60">🇲🇾 +60</option>
                                <option value="+65">🇸🇬 +65</option>
                                <option value="+673">🇧🇳 +673</option>
                                <option value="+62">🇮🇩 +62</option>
                            </select>
                            <input name="phone" type="tel" required autocomplete="tel" class="w-full border-none bg-transparent px-4 py-3 focus:outline-none">
                        </div>
                    </label>
                </div>

                <!-- Delivery Toggle -->
                <div class="mt-8 border-t border-slate-100 pt-8">
                    <h2 class="text-xl font-serif">Delivery method</h2>
                    <div class="mt-4 flex gap-2 rounded-none border border-slate-200 p-1 bg-slate-50">
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="deliveryMethod" value="delivery" checked class="peer sr-only">
                            <div class="rounded-none py-2.5 text-center text-sm font-semibold text-slate-500 peer-checked:bg-white peer-checked:text-slate-950 peer-checked:shadow-sm">Ship to address</div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="deliveryMethod" value="pickup" class="peer sr-only">
                            <div class="rounded-none py-2.5 text-center text-sm font-semibold text-slate-500 peer-checked:bg-white peer-checked:text-slate-950 peer-checked:shadow-sm">Self pickup in store</div>
                        </label>
                    </div>
                </div>

                <!-- Shipping Address (Hidden if Pickup is selected) -->
                <div id="address-section" class="mt-8 border-t border-slate-100 pt-8">
                    <h2 class="text-xl font-serif">Shipping address</h2>
                    <div class="mt-6 grid gap-4 sm:grid-cols-2">
                        <label class="sm:col-span-2">
                            <span class="text-sm font-medium">Address</span>
                            <input name="address1" required maxlength="120" autocomplete="address-line1" class="address-input mt-2 w-full rounded-none border border-slate-300 px-4 py-3">
                        </label>
                        <label class="sm:col-span-2">
                            <span class="text-sm font-medium">Address line 2</span>
                            <input name="address2" maxlength="120" autocomplete="address-line2" class="address-input mt-2 w-full rounded-none border border-slate-300 px-4 py-3">
                        </label>
                        <label class="sm:col-span-1">
                            <span class="text-sm font-medium">City</span>
                            <input name="city" required maxlength="80" autocomplete="address-level2" class="address-input mt-2 w-full rounded-none border border-slate-300 px-4 py-3">
                        </label>
                        <label class="sm:col-span-1">
                            <span class="text-sm font-medium">State</span>
                            <select id="state-select" name="state" required class="address-input mt-2 w-full rounded-none border border-slate-300 px-4 py-3 bg-white">
                                <option value="" disabled selected>Select a state...</option>
                                <option value="Johor">Johor</option>
                                <option value="Kedah">Kedah</option>
                                <option value="Kelantan">Kelantan</option>
                                <option value="Melaka">Melaka</option>
                                <option value="Negeri Sembilan">Negeri Sembilan</option>
                                <option value="Pahang">Pahang</option>
                                <option value="Penang">Penang</option>
                                <option value="Perak">Perak</option>
                                <option value="Perlis">Perlis</option>
                                <option value="Sabah">Sabah</option>
                                <option value="Sarawak">Sarawak</option>
                                <option value="Selangor">Selangor</option>
                                <option value="Terengganu">Terengganu</option>
                                <option value="W.P. Kuala Lumpur">W.P. Kuala Lumpur</option>
                                <option value="W.P. Labuan">W.P. Labuan</option>
                                <option value="W.P. Putrajaya">W.P. Putrajaya</option>
                            </select>
                        </label>
                        <label class="sm:col-span-1">
                            <span class="text-sm font-medium">Postal code</span>
                            <input name="postalCode" required maxlength="20" autocomplete="postal-code" class="address-input mt-2 w-full rounded-none border border-slate-300 px-4 py-3">
                        </label>
                        <label class="sm:col-span-1">
                            <span class="text-sm font-medium">Country</span>
                            <p class="mt-2 border-b border-slate-300 py-3 text-sm">Malaysia only</p>
                            <input type="hidden" name="country" value="Malaysia" class="address-input">
                        </label>
                    </div>
                </div>

                <!-- Billing Address (Hidden by default, shown if Pickup is selected) -->
                <div id="billing-section" class="hidden mt-8 border-t border-slate-100 pt-8">
                    <h2 class="text-xl font-serif">Billing address</h2>
                    <div class="mt-6 grid gap-4 sm:grid-cols-2">
                        <label class="sm:col-span-2">
                            <span class="text-sm font-medium">Address</span>
                            <input name="address1" disabled required maxlength="120" autocomplete="billing address-line1" class="billing-input mt-2 w-full rounded-none border border-slate-300 px-4 py-3">
                        </label>
                        <label class="sm:col-span-2">
                            <span class="text-sm font-medium">Address line 2</span>
                            <input name="address2" disabled maxlength="120" autocomplete="billing address-line2" class="billing-input mt-2 w-full rounded-none border border-slate-300 px-4 py-3">
                        </label>
                        <label class="sm:col-span-1">
                            <span class="text-sm font-medium">City</span>
                            <input name="city" disabled required maxlength="80" autocomplete="billing address-level2" class="billing-input mt-2 w-full rounded-none border border-slate-300 px-4 py-3">
                        </label>
                        <label class="sm:col-span-1">
                            <span class="text-sm font-medium">State</span>
                            <select name="state" disabled required class="billing-input mt-2 w-full rounded-none border border-slate-300 px-4 py-3 bg-white">
                                <option value="" disabled selected>Select a state...</option>
                                <option value="Johor">Johor</option>
                                <option value="Kedah">Kedah</option>
                                <option value="Kelantan">Kelantan</option>
                                <option value="Melaka">Melaka</option>
                                <option value="Negeri Sembilan">Negeri Sembilan</option>
                                <option value="Pahang">Pahang</option>
                                <option value="Penang">Penang</option>
                                <option value="Perak">Perak</option>
                                <option value="Perlis">Perlis</option>
                                <option value="Sabah">Sabah</option>
                                <option value="Sarawak">Sarawak</option>
                                <option value="Selangor">Selangor</option>
                                <option value="Terengganu">Terengganu</option>
                                <option value="W.P. Kuala Lumpur">W.P. Kuala Lumpur</option>
                                <option value="W.P. Labuan">W.P. Labuan</option>
                                <option value="W.P. Putrajaya">W.P. Putrajaya</option>
                            </select>
                        </label>
                        <label class="sm:col-span-1">
                            <span class="text-sm font-medium">Postal code</span>
                            <input name="postalCode" disabled required maxlength="20" autocomplete="billing postal-code" class="billing-input mt-2 w-full rounded-none border border-slate-300 px-4 py-3">
                        </label>
                        <label class="sm:col-span-1">
                            <span class="text-sm font-medium">Country</span>
                            <p class="mt-2 border-b border-slate-300 py-3 text-sm">Malaysia only</p>
                            <input type="hidden" name="country" value="Malaysia" disabled class="billing-input">
                        </label>
                    </div>
                </div>
                
               <button type="submit" class="lumiere-btn mt-8 w-full">Continue to payment</button>
            </form>
            <aside id="order-summary"></aside>
        </div>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="/js/checkout.js?v=payment-ui-2"></script>
</body>
</html>
