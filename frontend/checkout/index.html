<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/petitbakery-logo.png" />
    <meta name="color-scheme" content="light" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="/js/config.js"></script>
    <title>Checkout · PetitBakery</title>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <header id="site-header" class="sticky top-0 z-40"></header>
    <main class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
      <h1 class="text-4xl font-black tracking-tight">Checkout</h1>
      <p class="mt-2 text-slate-500">Demo checkout. Card details stay in this browser and are never collected.</p>
      <div id="checkout-root" class="mt-8 grid gap-8 lg:grid-cols-[1fr_380px]">
        <form
          id="checkout-form"
          class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm"
        >
          <h2 class="text-xl font-black">1. Delivery address</h2>
          <div class="mt-6 grid gap-4 sm:grid-cols-2">
            <label class="sm:col-span-2"
              ><span class="text-sm font-medium">Full name</span
              ><input
                name="fullName"
                required
                maxlength="80"
                autocomplete="name"
                class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3" /></label
            ><label class="sm:col-span-2"
              ><span class="text-sm font-medium">Address</span
              ><input
                name="address1"
                required
                maxlength="120"
                autocomplete="address-line1"
                class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3" /></label
            ><label class="sm:col-span-2"
              ><span class="text-sm font-medium">Address line 2</span
              ><input
                name="address2"
                maxlength="120"
                autocomplete="address-line2"
                class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3" /></label
            ><label
              ><span class="text-sm font-medium">City</span
              ><input
                name="city"
                required
                maxlength="80"
                autocomplete="address-level2"
                class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3" /></label
            ><label
              ><span class="text-sm font-medium">Postal code</span
              ><input
                name="postalCode"
                required
                maxlength="20"
                autocomplete="postal-code"
                class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3" /></label
            ><label class="sm:col-span-2"
              ><span class="text-sm font-medium">Country</span
              ><input
                name="country"
                value="Malaysia"
                required
                maxlength="60"
                autocomplete="country-name"
                class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3"
            /></label>
          </div>
          <label class="mt-4 flex items-center gap-2 text-sm"><input name="saveAsDefault" type="checkbox"> Save as my default address</label>
          <fieldset class="mt-8 border-t border-slate-200 pt-6"><legend class="text-xl font-black">2. Payment method</legend>
            <label class="mt-4 flex gap-3 rounded-xl border border-slate-300 p-4"><input type="radio" name="paymentMethod" value="qr" checked><span><b>QR payment</b><span class="mt-1 block text-sm text-slate-500">Scan a one-time demo link.</span></span></label>
            <label class="mt-3 flex gap-3 rounded-xl border border-slate-300 p-4"><input type="radio" name="paymentMethod" value="card"><span><b>Demo card</b><span class="mt-1 block text-sm text-slate-500">Details are local-only; no charge is made.</span></span></label>
            <div id="card-fields" class="mt-3 hidden grid gap-3 rounded-xl bg-orange-50 p-4 sm:grid-cols-2"><label class="sm:col-span-2 text-sm">Card number<input inputmode="numeric" autocomplete="cc-number" placeholder="4111 1111 1111 1111" class="mt-1 w-full rounded-lg border border-slate-300 p-2"></label><label class="text-sm">Expiry<input placeholder="MM/YY" autocomplete="cc-exp" class="mt-1 w-full rounded-lg border border-slate-300 p-2"></label><label class="text-sm">CVV<input inputmode="numeric" autocomplete="cc-csc" placeholder="123" class="mt-1 w-full rounded-lg border border-slate-300 p-2"></label></div>
          </fieldset>
          <button
            type="submit"
            class="mt-6 w-full rounded-xl bg-slate-950 px-5 py-3 font-semibold text-white hover:bg-slate-800"
          >
            Continue to payment
          </button>
        </form>
        <aside id="order-summary"></aside>
      </div>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="/checkout/checkout.js"></script>
  </body>
</html>
