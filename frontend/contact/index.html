<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="/js/config.js"></script>
  <title>Contact · LUMIÈRE</title>
</head>
<body class="min-h-screen flex flex-col bg-slate-50">
  <header id="site-header"></header>
  
  <main class="flex-grow w-full max-w-5xl mx-auto px-4 py-16 sm:px-6 lg:px-8">
    <div class="mb-12 text-center">
      <p class="text-[10px] font-bold tracking-[0.2em] text-slate-400 uppercase mb-4">Client Services</p>
      <h1 class="text-4xl font-serif text-slate-900">Contact Us</h1>
    </div>
    
    <div class="bg-white border border-slate-200 shadow-sm grid md:grid-cols-2 overflow-hidden">
      <!-- Left: Boutique Info -->
      <div class="bg-slate-950 p-10 sm:p-16 text-white flex flex-col justify-center">
        <h2 class="text-2xl font-serif mb-6">Pavilion KL Boutique</h2>
        <p class="text-sm text-slate-400 leading-relaxed mb-8">
          168 Jalan Bukit Bintang<br>
          Level 2, Luxury Precinct<br>
          55100 Kuala Lumpur, Malaysia
        </p>
        
        <div class="space-y-4 text-sm">
          <div>
            <p class="text-[9px] font-bold tracking-widest text-slate-500 uppercase mb-1">Boutique Hours</p>
            <p class="text-slate-300">Mon-Sun: 10:00 AM – 10:00 PM</p>
          </div>
        </div>
      </div>
      
      <!-- Right: Contact Form -->
      <div class="p-10 sm:p-16 flex flex-col justify-center">
        <form id="contact-form" class="space-y-6">
          <div>
            <label for="contact-name" class="block text-[10px] font-bold tracking-[0.2em] text-slate-400 uppercase mb-2">Name</label>
            <input id="contact-name" type="text" required placeholder="Enter your name" class="w-full border border-slate-200 p-3 text-sm focus:border-slate-900 focus:outline-none focus:ring-1 focus:ring-slate-900 bg-white">
          </div>
          <div>
            <label for="contact-email" class="block text-[10px] font-bold tracking-[0.2em] text-slate-400 uppercase mb-2">Email</label>
            <input id="contact-email" type="email" required placeholder="Enter your email" class="w-full border border-slate-200 p-3 text-sm focus:border-slate-900 focus:outline-none focus:ring-1 focus:ring-slate-900 bg-white">
          </div>
          <div>
            <label for="contact-message" class="block text-[10px] font-bold tracking-[0.2em] text-slate-400 uppercase mb-2">Message</label>
            <textarea id="contact-message" required rows="4" placeholder="How can we assist you?" class="w-full border border-slate-200 p-3 text-sm focus:border-slate-900 focus:outline-none focus:ring-1 focus:ring-slate-900 bg-white resize-none"></textarea>
          </div>
          <button type="submit" class="w-full lumiere-btn">Open Email Draft</button>
          <p class="text-sm text-slate-500">Review and send the inquiry in your email app.</p>
        </form>
      </div>
    </div>
  </main>
  
  <footer id="site-footer"></footer>
  <script type="module" src="/js/static.js"></script>
</body>
</html>
