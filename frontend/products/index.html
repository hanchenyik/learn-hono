<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/petitbakery-logo.png" />
    <meta name="color-scheme" content="light" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="/js/config.js"></script>
    <title>Treats · PetitBakery</title>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <header id="site-header" class="sticky top-0 z-40"></header>
    <main class="pb-main">
      <section class="pb-section" aria-labelledby="treats-title">
        <div class="pb-section-head">
          <div>
            <span class="pb-kicker">Made today</span>
            <h1 id="treats-title" class="pb-display">All the treats</h1>
          </div>
          <p>
            Search the catalogue, filter by category, and add a treat to your
            local cart.
          </p>
        </div>
        <div class="pb-toolbar">
          <input
            id="search"
            class="pb-field pb-search"
            type="search"
            placeholder="Search cakes, cookies…"
            aria-label="Search treats"
          /><select
            id="category"
            class="pb-field"
            aria-label="Filter by category"
          >
            <option value="">All treats</option>
            <option>Cakes</option>
            <option>Pastries</option>
            <option>Cookies</option>
            <option>Chocolates</option>
          </select>
        </div>
        <div id="product-grid" class="pb-product-grid" aria-live="polite">
          <p>Loading treats…</p>
        </div>
      </section>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="/products/list.js"></script>
  </body>
</html>
