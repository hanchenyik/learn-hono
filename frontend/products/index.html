<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="/js/config.js"></script>
  <title>Collection · LUMIÈRE</title>
</head>
<body class="min-h-screen flex flex-col bg-slate-50">
  <header id="site-header"></header>
  
  <main class="flex-grow w-full max-w-7xl mx-auto px-4 py-12 sm:px-6 lg:px-8">
    <div class="mb-8 text-[10px] font-bold tracking-widest text-slate-400 uppercase">
       HOME / THE COLLECTION
    </div>
    <h1 class="text-4xl font-serif text-slate-900 mb-12">The Collection</h1>
    
    <div class="grid lg:grid-cols-[240px_1fr] gap-12">
      <!-- Sidebar Filters -->
      <aside>
        <div class="mb-10">
          <h3 class="text-[10px] font-bold tracking-[0.2em] text-slate-900 uppercase mb-4">Category</h3>
          <ul class="space-y-4 text-sm">
            <li><a href="#" class="cat-link font-bold text-slate-900" data-category="">All Categories</a></li>
            <li><a href="#" class="cat-link text-slate-500 hover:text-slate-900 transition-colors" data-category="Bags">Bags</a></li>
            <li><a href="#" class="cat-link text-slate-500 hover:text-slate-900 transition-colors" data-category="Bangles">Bangles & Bracelets</a></li>
            <li><a href="#" class="cat-link text-slate-500 hover:text-slate-900 transition-colors" data-category="Watches">Watches</a></li>
            <li><a href="#" class="cat-link text-slate-500 hover:text-slate-900 transition-colors" data-category="Necklaces">Necklaces</a></li>
          </ul>
        </div>

        <div class="mb-10">
          <h3 class="text-[10px] font-bold tracking-[0.2em] text-slate-900 uppercase mb-4">Price Range</h3>
          <ul class="space-y-4 text-sm">
            <li><a href="#" class="price-link font-bold text-slate-900" data-price="">All Prices</a></li>
            <li><a href="#" class="price-link text-slate-500 hover:text-slate-900 transition-colors" data-price="under-5k">Under RM 5,000</a></li>
            <li><a href="#" class="price-link text-slate-500 hover:text-slate-900 transition-colors" data-price="5k-10k">RM 5,000 - RM 10,000</a></li>
            <li><a href="#" class="price-link text-slate-500 hover:text-slate-900 transition-colors" data-price="over-10k">Over RM 10,000</a></li>
          </ul>
        </div>
        
        <div>
          <label for="search" class="block text-[10px] font-bold tracking-[0.2em] text-slate-900 uppercase mb-4">Search</label>
          <input id="search" type="text" placeholder="Search collection..." class="w-full border border-slate-200 p-3 text-sm focus:border-slate-900 focus:outline-none bg-white">
        </div>
      </aside>
      
      <!-- Product Grid -->
      <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <p class="text-slate-500 font-serif">Loading collection...</p>
      </div>
    </div>
  </main>
  
  <footer id="site-footer"></footer>
  <script type="module" src="/js/products.js"></script>
</body>
</html>
